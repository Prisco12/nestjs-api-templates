name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [api-mongo, api-postgres]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=templates/${{ matrix.template }}
      - run: npm run lint --workspace=templates/${{ matrix.template }}
      - run: npm test --workspace=templates/${{ matrix.template }} -- --runInBand

  integration:
    name: Integration (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        template: [api-mongo, api-postgres]
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - if: matrix.template == 'api-mongo'
        run: sed -i 's|^MONGODB_URI=.*|MONGODB_URI=mongodb://mongo:27017/nest_api|' .env
      - if: matrix.template == 'api-postgres'
        run: sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nest_api?schema=public|' .env
      - run: docker compose up --build -d
      - if: matrix.template == 'api-postgres'
        run: docker compose exec -T api npx prisma migrate deploy
      - run: docker compose exec -T api npm run seed
      - run: docker compose exec -T api npm run test:integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v --remove-orphans
